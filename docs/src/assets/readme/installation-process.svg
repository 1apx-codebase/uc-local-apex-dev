<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">UC Local APEX Dev installation process</title>
  <desc id="desc">A five step installation flow: install prerequisites, clone the repository, run install.sh, wait for database and ORDS startup, then open APEX.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#2f5d62"/>
      <stop offset="1" stop-color="#326273"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2933" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#326273"/>
    </marker>
  </defs>
  <rect width="1200" height="520" fill="#f7faf9"/>
  <rect x="0" y="0" width="1200" height="98" fill="url(#header)"/>
  <text x="60" y="58" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Install UC Local APEX Dev</text>
  <text x="60" y="84" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#dbe9e8">Follow these steps from left to right.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <g filter="url(#shadow)">
      <rect x="50" y="160" width="190" height="230" rx="12" fill="#ffffff" stroke="#c7d8d5"/>
      <circle cx="95" cy="205" r="26" fill="#e0f0ed" stroke="#2f5d62"/>
      <text x="88" y="214" font-size="24" font-weight="700" fill="#2f5d62">1</text>
      <text x="80" y="262" font-size="19" font-weight="700" fill="#1f2933">Install tools</text>
      <text x="80" y="294" font-size="14" fill="#425466">Docker or Podman</text>
      <text x="80" y="318" font-size="14" fill="#425466">Compose</text>
      <text x="80" y="342" font-size="14" fill="#425466">SQLcl</text>
    </g>

    <path d="M250 275 H312" stroke="#326273" stroke-width="4" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="320" y="160" width="190" height="230" rx="12" fill="#ffffff" stroke="#c7d8d5"/>
      <circle cx="365" cy="205" r="26" fill="#e8f0fe" stroke="#355c9c"/>
      <text x="358" y="214" font-size="24" font-weight="700" fill="#355c9c">2</text>
      <text x="350" y="262" font-size="19" font-weight="700" fill="#1f2933">Get the code</text>
      <text x="350" y="294" font-size="14" fill="#425466">Clone the repo</text>
      <text x="350" y="318" font-size="14" fill="#425466">Enter the folder</text>
      <text x="350" y="342" font-size="14" fill="#425466">Make scripts executable</text>
    </g>

    <path d="M520 275 H582" stroke="#326273" stroke-width="4" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="590" y="160" width="190" height="230" rx="12" fill="#ffffff" stroke="#c7d8d5"/>
      <circle cx="635" cy="205" r="26" fill="#fff4d6" stroke="#9f6b00"/>
      <text x="628" y="214" font-size="24" font-weight="700" fill="#9f6b00">3</text>
      <text x="620" y="262" font-size="19" font-weight="700" fill="#1f2933">Run installer</text>
      <text x="620" y="294" font-size="14" fill="#425466">Run ./install.sh</text>
      <text x="620" y="318" font-size="14" fill="#425466">Create .env</text>
      <text x="620" y="342" font-size="14" fill="#425466">Pull images</text>
    </g>

    <path d="M790 275 H852" stroke="#326273" stroke-width="4" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="860" y="160" width="190" height="230" rx="12" fill="#ffffff" stroke="#c7d8d5"/>
      <circle cx="905" cy="205" r="26" fill="#fde8e7" stroke="#9b2c2c"/>
      <text x="898" y="214" font-size="24" font-weight="700" fill="#9b2c2c">4</text>
      <text x="890" y="262" font-size="19" font-weight="700" fill="#1f2933">Wait for startup</text>
      <text x="890" y="294" font-size="14" fill="#425466">Database starts</text>
      <text x="890" y="318" font-size="14" fill="#425466">ORDS initializes</text>
      <text x="890" y="342" font-size="14" fill="#425466">APEX is configured</text>
    </g>

    <path d="M1050 275 H1092" stroke="#326273" stroke-width="4" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="900" y="420" width="250" height="58" rx="29" fill="#2f5d62"/>
      <text x="944" y="456" font-size="18" font-weight="700" fill="#ffffff">Open APEX in your browser</text>
    </g>
  </g>
</svg>
