<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">UC Local APEX Dev container setup</title>
  <desc id="desc">The local machine runs a Docker or Podman network with an Oracle Database container and an ORDS container. ORDS exposes HTTP and HTTPS ports, connects to the database, and uses bind mounts for configuration and APEX images. The database stores data in the oradata-26ai volume.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2933" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#326273"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#687782"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#f7faf9"/>
  <text x="60" y="62" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2933">Container Setup</text>
  <text x="60" y="92" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#425466">Docker or Podman runs two containers, one network, one database volume, and two bind mounts.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="55" y="130" width="1090" height="410" rx="18" fill="#ffffff" stroke="#c7d8d5" stroke-width="2"/>
    <text x="88" y="168" font-size="18" font-weight="700" fill="#2f5d62">Local Docker or Podman network</text>

    <g filter="url(#shadow)">
      <rect x="120" y="230" width="300" height="210" rx="14" fill="#eef7f5" stroke="#2f5d62" stroke-width="2"/>
      <text x="150" y="270" font-size="22" font-weight="700" fill="#1f2933">Oracle Database</text>
      <text x="150" y="302" font-size="15" fill="#425466">Container: local-26ai</text>
      <text x="150" y="328" font-size="15" fill="#425466">Image: database/free:23.26.2.0</text>
      <text x="150" y="354" font-size="15" fill="#425466">Port: 1521</text>
      <text x="150" y="380" font-size="15" fill="#425466">Service: FREEPDB1</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="780" y="230" width="300" height="210" rx="14" fill="#f0f4ff" stroke="#355c9c" stroke-width="2"/>
      <text x="810" y="270" font-size="22" font-weight="700" fill="#1f2933">ORDS</text>
      <text x="810" y="302" font-size="15" fill="#425466">Container: local-26ai-ords</text>
      <text x="810" y="328" font-size="15" fill="#425466">Image: database/ords:26.1.2</text>
      <text x="810" y="354" font-size="15" fill="#425466">HTTP: localhost:8181</text>
      <text x="810" y="380" font-size="15" fill="#425466">HTTPS: localhost:8443</text>
    </g>

    <path d="M780 335 H430" stroke="#326273" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="505" y="318" font-size="15" font-weight="700" fill="#326273">ORDS connects to database</text>

    <g filter="url(#shadow)">
      <rect x="110" y="555" width="320" height="54" rx="12" fill="#ffffff" stroke="#c7d8d5"/>
      <text x="135" y="589" font-size="16" font-weight="700" fill="#1f2933">Volume: oradata-26ai</text>
    </g>
    <path d="M270 555 V448" stroke="#687782" stroke-width="3" marker-end="url(#arrow-gray)"/>
    <text x="306" y="505" font-size="14" fill="#687782">database files</text>

    <g filter="url(#shadow)">
      <rect x="770" y="555" width="165" height="54" rx="12" fill="#ffffff" stroke="#c7d8d5"/>
      <text x="795" y="589" font-size="16" font-weight="700" fill="#1f2933">ords-config</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="955" y="555" width="165" height="54" rx="12" fill="#ffffff" stroke="#c7d8d5"/>
      <text x="976" y="589" font-size="16" font-weight="700" fill="#1f2933">apex-images</text>
    </g>
    <path d="M852 555 V448" stroke="#687782" stroke-width="3" marker-end="url(#arrow-gray)"/>
    <path d="M1038 555 V448" stroke="#687782" stroke-width="3" marker-end="url(#arrow-gray)"/>
    <text x="887" y="505" font-size="14" fill="#687782">bind mounts</text>

    <g filter="url(#shadow)">
      <rect x="500" y="132" width="200" height="74" rx="14" fill="#fff7e8" stroke="#b7791f"/>
      <text x="540" y="162" font-size="18" font-weight="700" fill="#1f2933">Your browser</text>
      <text x="523" y="188" font-size="14" fill="#425466">APEX and ORDS URLs</text>
    </g>
    <path d="M700 176 C780 176 850 195 895 230" fill="none" stroke="#b7791f" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
